name: CI Tests
on: 
  push:
    branches: ["main"]
    pull_request: ["main"]

  jobs:
      tests:
        runs-on: ubuntu-latest

        steps:
            - name: Ckeckout repository
              users: actions/ckeckout@v4   
              with: 
                node-version: 18
                cache:"npm"
                
            - name: Install Dependencias SEO    
              run: npm install

            - name: Run unit + Integrations Tests (Vitest) 
              run: npm run test:ci
